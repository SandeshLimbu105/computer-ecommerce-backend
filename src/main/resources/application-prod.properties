# =============================================
# PRODUCTION CONFIGURATION
# =============================================
# ?? WARNING: This file has PRODUCTION SECRETS
# ?? NEVER push this to GitHub!

# ===== SERVER CONFIGURATION =====
server.port=8080

# ? NEW: Spring Boot 3.x error handling - Production (SECURE)
server.error.include.message=never
server.error.include.binding-errors=never
server.error.include.exception=false
server.error.include.stacktrace=never

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://your-production-server:3306/computer_parts_db
spring.datasource.username=prod_username
spring.datasource.password=prod_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA & HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT CONFIGURATION =====
jwt.secret=prod_very_long_and_secure_jwt_secret_key_256_bits
jwt.expiration=86400000

# ===== ESEWA PAYMENT CONFIGURATION =====
esewa.sandbox.url=https://epay.esewa.com.np/api/epay/main/v2/form
esewa.merchant.code=YOUR_PROD_MERCHANT_CODE
esewa.secret.key=your_prod_esewa_secret_key
esewa.success.url=https://yourdomain.com/api/payments/esewa/success
esewa.failure.url=https://yourdomain.com/api/payments/esewa/failure

# ===== LOGGING =====
logging.level.org.texas.computerecommerce=INFO