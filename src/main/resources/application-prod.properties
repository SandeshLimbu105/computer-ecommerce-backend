# =============================================
# PRODUCTION CONFIGURATION (for Render + Aiven)
# =============================================

# ===== SERVER CONFIGURATION =====
server.port=${PORT:8080}

# ===== ERROR HANDLING =====
server.error.include.message=never
server.error.include.binding-errors=never
server.error.include.exception=false
server.error.include.stacktrace=never

# ===== DATABASE CONFIGURATION (Aiven MySQL SSL) =====
# ? KEY FIX: Uses useSSL=true + requireSSL=false + verifyServerCertificate=false
# This allows connection without CA certificate validation
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA & HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== ESEWA PAYMENT CONFIGURATION =====
esewa.sandbox.url=${ESEWA_SANDBOX_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.merchant.code=${ESEWA_MERCHANT_CODE:EPAYTEST}
esewa.secret.key=${ESEWA_SECRET_KEY}
esewa.success.url=${ESEWA_SUCCESS_URL}
esewa.failure.url=${ESEWA_FAILURE_URL}

# ===== FRONTEND URL =====
frontend.base.url=${FRONTEND_BASE_URL}

# ===== LOGGING =====
logging.level.org.texas.computerecommerce=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN