# =============================================
# APPLICATION PROPERTIES - MAIN CONFIG
# =============================================
# This file uses environment variables - SAFE to commit to GitHub

# ===== SERVER CONFIGURATION =====
server.port=${PORT:8080}

# ? NEW: Spring Boot 3.x error handling
server.error.include.message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include.binding-errors=${ERROR_INCLUDE_BINDING:never}
server.error.include.exception=${ERROR_INCLUDE_EXCEPTION:false}
server.error.include.stacktrace=${ERROR_INCLUDE_STACKTRACE:never}

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/computer_parts_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA & HIBERNATE =====
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== ESEWA PAYMENT CONFIGURATION =====
esewa.sandbox.url=${ESEWA_SANDBOX_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.merchant.code=${ESEWA_MERCHANT_CODE:EPAYTEST}
esewa.secret.key=${ESEWA_SECRET_KEY}
esewa.success.url=${ESEWA_SUCCESS_URL:http://localhost:8080/api/payments/esewa/success}
esewa.failure.url=${ESEWA_FAILURE_URL:http://localhost:8080/api/payments/esewa/failure}

# ===== LOGGING =====
logging.level.org.texas.computerecommerce=${LOG_LEVEL:DEBUG}