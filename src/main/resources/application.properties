# =============================================
# APPLICATION PROPERTIES
# =============================================

# ===== SERVER CONFIGURATION =====
server.port=8080

# ===== ERROR HANDLING =====
server.error.include.message=always
server.error.include.binding-errors=always
server.error.include.exception=true
server.error.include.stacktrace=never

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/computer_parts_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA & HIBERNATE =====
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== ESEWA PAYMENT CONFIGURATION =====
esewa.sandbox.url=${ESEWA_SANDBOX_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.merchant.code=${ESEWA_MERCHANT_CODE:EPAYTEST}
esewa.secret.key=${ESEWA_SECRET_KEY}
esewa.success.url=${ESEWA_SUCCESS_URL:http://localhost:8080/api/payments/esewa/success}
esewa.failure.url=${ESEWA_FAILURE_URL:http://localhost:8080/api/payments/esewa/failure}

# ===== FRONTEND URL =====
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:5173}

# ===== LOGGING =====
logging.level.org.texas.computerecommerce=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}